apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hackerspider09/ms-ecommerce.git
    targetRevision: main
    path: k8s/gateway/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: ms-gateway
  
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true