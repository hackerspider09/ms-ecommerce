apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hackerspider09/ms-ecommerce.git
    targetRevision: main
    path: k8s/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: ms-ecom
  
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true