apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo_app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hackerspider09/ms-ecommerce.git
    targetRevision: main
    path: /argocd/apps 
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated: {}