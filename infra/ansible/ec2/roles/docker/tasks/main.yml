

- name: Remove packages
  apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc 
      - podman-docker 
      - containerd 
      - runc
    state: absent


- name: Create keyrings dir
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add docker gpg key
  get_url:
    url: "https://download.docker.com/linux/ubuntu/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add docker repo
  copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts["distribution_release"] }}
      Components: stable
      Architectures: {{ system_arch }}
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install docker 
  apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present

- name: Check docker service 
  service:
    name: docker
    state: started
    enabled: true

- name: Add user to docker group 
  user:
    groups: docker
    append: true 
    user: "{{ ansible_user }}"
    # ansible_user is provided in inv file  
  register: is_user_modified


#  meta can directly talk to ansible so it can alter execution flow
#  handler can run after post task but what if we want it to run immediate use meta module
- name: Refresh machine session by reseting ssh connection
  meta: reset_connection




