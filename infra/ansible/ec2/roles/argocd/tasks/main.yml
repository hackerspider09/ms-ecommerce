
- name: Create argocd ns
  shell: |
    kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

# 1st dry run will create YAML and will pass to pipe 
# - is unix convention for stdin and stdout 
# and k8s has explicitly implemented -f - "read manifest from stdin"

- name: Install ArgoCD 
  # shell: |
  #   kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo-cd
    chart_repo_url: https://argoproj.github.io/argo-helm
    release_namespace: argocd
    create_namespace: false
    wait: true
    values:
      server:
        extraArgs:
          - --insecure
          - --rootpath=/argocd
# added --rootpath so argocd can available at /argocd instead of /
# using helm instead of kubectl to install argocd with extraArgs

# - name: Wait for ArgoCD
#   shell: |
#     kubectl wait --for=condition=Ready pods --all -n argocd --timeout=300s

- name: Get password for argocd
  shell: |
    kubectl -n argocd get secret argocd-initial-admin-secret \
    -o jsonpath="{.data.password}" | base64 -d; echo ""
  register: pass_reg
  changed_when: false

- name: Print password for argo
  debug:
    msg: |
      password => {{ pass_reg.stdout }}

      cmd for port forward =>
      kubectl port-forward service/argocd-server -n argocd 8000:80 --address=0.0.0.0

- name: Copy application manifest  
  copy:
    src: "../../../argocd/argo_app/argo_app_{{dep_env}}.yaml"
    dest: "/tmp/argo_app.yaml"

- name: Run argo application manifest
  shell: |
    kubectl apply -f /tmp/argo_app.yaml



